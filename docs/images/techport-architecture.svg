<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title description">
  <title id="title">TechPort 인프라 아키텍처</title>
  <desc id="description">Vercel 프론트엔드와 AWS EC2 백엔드, MySQL, 외부 기술 블로그, OpenAI API 및 GitHub Actions 배포 흐름</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14213d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, "Noto Sans KR", sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, "Noto Sans KR", sans-serif; fill: #667085; }
      .section { font: 700 18px Arial, "Noto Sans KR", sans-serif; fill: #344054; }
      .label { font: 700 18px Arial, "Noto Sans KR", sans-serif; fill: #101828; }
      .small { font: 400 14px Arial, "Noto Sans KR", sans-serif; fill: #475467; }
      .tiny { font: 600 12px Arial, "Noto Sans KR", sans-serif; fill: #667085; }
      .box { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .arrow { fill: none; stroke: #344054; stroke-width: 2.5; marker-end: url(#arrow); }
      .deploy { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1400" height="860" fill="#ffffff"/>
  <text x="55" y="58" class="title">TechPort Infrastructure Architecture</text>
  <text x="55" y="86" class="subtitle">실제 운영 환경의 요청 처리, 외부 연동 및 백엔드 배포 흐름</text>

  <!-- Runtime flow -->
  <rect x="48" y="122" width="1304" height="438" rx="20" fill="#f8fafc" stroke="#e4e7ec" stroke-width="2"/>
  <text x="72" y="157" class="section">서비스 요청 흐름</text>

  <!-- User -->
  <circle cx="119" cy="301" r="35" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <circle cx="119" cy="289" r="10" fill="#6366f1"/>
  <path d="M99 321 C102 303,136 303,139 321" fill="#6366f1"/>
  <text x="119" y="360" text-anchor="middle" class="label">사용자</text>
  <text x="119" y="383" text-anchor="middle" class="small">Browser</text>

  <!-- Vercel -->
  <rect x="225" y="232" width="220" height="145" class="box"/>
  <path d="M335 257 L358 296 L312 296 Z" fill="#111827"/>
  <text x="335" y="329" text-anchor="middle" class="label">Vercel</text>
  <text x="335" y="353" text-anchor="middle" class="small">React · TypeScript · Vite</text>

  <!-- HTTPS -->
  <path d="M157 301 H218" class="arrow"/>
  <text x="187" y="287" text-anchor="middle" class="tiny">HTTPS</text>

  <!-- AWS boundary -->
  <rect x="520" y="185" width="780" height="330" rx="18" fill="#fffaf0" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="544" y="166" width="158" height="38" rx="8" fill="#ff9900"/>
  <text x="623" y="191" text-anchor="middle" style="font:700 16px Arial, sans-serif;fill:#232f3e">AWS · Seoul Region</text>

  <!-- EC2 boundary -->
  <rect x="550" y="225" width="720" height="255" rx="16" fill="#ffffff" stroke="#f7b84b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="575" y="255" class="section">EC2 · Docker Compose</text>

  <!-- Nginx -->
  <rect x="585" y="292" width="178" height="116" rx="14" fill="#ecfdf3" stroke="#12b76a" stroke-width="2"/>
  <polygon points="618,320 640,307 662,320 662,347 640,360 618,347" fill="#009639"/>
  <text x="682" y="333" class="label">Nginx</text>
  <text x="674" y="381" text-anchor="middle" class="small">HTTPS · Reverse Proxy</text>

  <!-- Spring -->
  <rect x="820" y="292" width="190" height="116" rx="14" fill="#f0fdf4" stroke="#65a30d" stroke-width="2"/>
  <circle cx="859" cy="333" r="24" fill="#6db33f"/>
  <path d="M846 336 C854 319,872 319,877 324 C866 325,854 332,849 344" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="891" y="338" class="label">Spring Boot</text>
  <text x="915" y="381" text-anchor="middle" class="small">Java 21 · REST API · Collector</text>

  <!-- MySQL -->
  <rect x="1068" y="292" width="165" height="116" rx="14" fill="#eff8ff" stroke="#2e90fa" stroke-width="2"/>
  <ellipse cx="1110" cy="324" rx="25" ry="10" fill="#4479a1"/>
  <path d="M1085 324 V350 C1085 363,1135 363,1135 350 V324" fill="#4479a1"/>
  <ellipse cx="1110" cy="350" rx="25" ry="10" fill="#315d7c"/>
  <text x="1170" y="340" text-anchor="middle" class="label">MySQL</text>
  <text x="1150" y="381" text-anchor="middle" class="small">8.4 LTS</text>

  <path d="M445 304 H578" class="arrow"/>
  <text x="511" y="290" text-anchor="middle" class="tiny">api.techport.dev</text>
  <path d="M763 350 H813" class="arrow"/>
  <text x="788" y="337" text-anchor="middle" class="tiny">:8080</text>
  <path d="M1010 350 H1061" class="arrow"/>
  <text x="1035" y="337" text-anchor="middle" class="tiny">JPA</text>

  <!-- External integrations -->
  <rect x="584" y="432" width="650" height="50" rx="10" fill="#f9fafb" stroke="#d0d5dd"/>
  <text x="604" y="462" class="small">컨테이너 내부 네트워크 · 외부에는 Nginx의 80/443 포트만 공개</text>

  <rect x="705" y="575" width="250" height="96" class="box"/>
  <text x="830" y="610" text-anchor="middle" class="label">글로벌 기술 블로그</text>
  <text x="830" y="637" text-anchor="middle" class="small">RSS · Atom · Sitemap · HTML</text>

  <rect x="1025" y="575" width="220" height="96" class="box"/>
  <g transform="translate(1048 594) scale(1.83)" fill="#111827" aria-label="OpenAI">
    <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/>
  </g>
  <text x="1148" y="612" text-anchor="middle" class="label">OpenAI API</text>
  <text x="1148" y="638" text-anchor="middle" class="small">선별 · 번역 · 분류</text>

  <path d="M830 575 V505 H915 V415" class="arrow"/>
  <path d="M1135 575 V505 H960 V415" class="arrow"/>

  <!-- Deployment flow -->
  <rect x="48" y="710" width="1304" height="105" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="72" y="744" class="section">백엔드 배포 흐름</text>

  <rect x="235" y="738" width="190" height="55" rx="12" fill="#ffffff" stroke="#98a2b3" stroke-width="2"/>
  <g transform="translate(240 755) scale(0.85)" fill="#2088ff" aria-label="GitHub Actions">
    <path d="M10.984 13.836a.5.5 0 0 1-.353-.146l-.745-.743a.5.5 0 1 1 .706-.708l.392.391 1.181-1.18a.5.5 0 0 1 .708.707l-1.535 1.533a.504.504 0 0 1-.354.146zm9.353-.147l1.534-1.532a.5.5 0 0 0-.707-.707l-1.181 1.18-.392-.391a.5.5 0 1 0-.706.708l.746.743a.497.497 0 0 0 .706-.001zM4.527 7.452l2.557-1.585A1 1 0 0 0 7.09 4.17L4.533 2.56A1 1 0 0 0 3 3.406v3.196a1.001 1.001 0 0 0 1.527.85zm2.03-2.436L4 6.602V3.406l2.557 1.61zM24 12.5c0 1.93-1.57 3.5-3.5 3.5a3.503 3.503 0 0 1-3.46-3h-2.08a3.503 3.503 0 0 1-3.46 3 3.502 3.502 0 0 1-3.46-3h-.558c-.972 0-1.85-.399-2.482-1.042V17c0 1.654 1.346 3 3 3h.04c.244-1.693 1.7-3 3.46-3 1.93 0 3.5 1.57 3.5 3.5S13.43 24 11.5 24a3.502 3.502 0 0 1-3.46-3H8c-2.206 0-4-1.794-4-4V9.899A5.008 5.008 0 0 1 0 5c0-2.757 2.243-5 5-5s5 2.243 5 5a5.005 5.005 0 0 1-4.952 4.998A2.482 2.482 0 0 0 7.482 12h.558c.244-1.693 1.7-3 3.46-3a3.502 3.502 0 0 1 3.46 3h2.08a3.503 3.503 0 0 1 3.46-3c1.93 0 3.5 1.57 3.5 3.5zm-15 8c0 1.378 1.122 2.5 2.5 2.5s2.5-1.122 2.5-2.5-1.122-2.5-2.5-2.5S9 19.122 9 20.5zM5 9c2.206 0 4-1.794 4-4S7.206 1 5 1 1 2.794 1 5s1.794 4 4 4zm9 3.5c0-1.378-1.122-2.5-2.5-2.5S9 11.122 9 12.5s1.122 2.5 2.5 2.5 2.5-1.122 2.5-2.5zm9 0c0-1.378-1.122-2.5-2.5-2.5S18 11.122 18 12.5s1.122 2.5 2.5 2.5 2.5-1.122 2.5-2.5zm-13 8a.5.5 0 1 0 1 0 .5.5 0 0 0-1 0zm2 0a.5.5 0 1 0 1 0 .5.5 0 0 0-1 0zm12 0c0 1.93-1.57 3.5-3.5 3.5a3.503 3.503 0 0 1-3.46-3.002c-.007.001-.013.005-.021.005l-.506.017h-.017a.5.5 0 0 1-.016-.999l.506-.017c.018-.002.035.006.052.007A3.503 3.503 0 0 1 20.5 17c1.93 0 3.5 1.57 3.5 3.5zm-1 0c0-1.378-1.122-2.5-2.5-2.5S18 19.122 18 20.5s1.122 2.5 2.5 2.5 2.5-1.122 2.5-2.5z"/>
  </g>
  <text x="355" y="771" text-anchor="middle" style="font:700 16px Arial, 'Noto Sans KR', sans-serif;fill:#101828">GitHub Actions</text>

  <rect x="545" y="738" width="170" height="55" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="630" y="771" text-anchor="middle" class="label">Amazon ECR</text>

  <rect x="835" y="738" width="170" height="55" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="920" y="771" text-anchor="middle" class="label">AWS SSM</text>

  <rect x="1120" y="738" width="150" height="55" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1195" y="771" text-anchor="middle" class="label">EC2 배포</text>

  <path d="M425 765 H538" class="deploy"/>
  <text x="481" y="751" text-anchor="middle" class="tiny">Docker image push</text>
  <path d="M715 765 H828" class="deploy"/>
  <text x="771" y="751" text-anchor="middle" class="tiny">image tag</text>
  <path d="M1005 765 H1113" class="deploy"/>
  <text x="1059" y="751" text-anchor="middle" class="tiny">pull &amp; restart</text>
</svg>
