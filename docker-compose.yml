services:
  mysql:
    image: mysql:8.4
    container_name: global-tech-blog-archive-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: global_tech_blog_archive
      MYSQL_USER: archive_user
      MYSQL_PASSWORD: archive_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
