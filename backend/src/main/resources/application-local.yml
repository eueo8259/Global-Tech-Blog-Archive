spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/global_tech_blog_archive}
    username: ${DB_USERNAME:archive_user}
    password: ${DB_PASSWORD:archive_password}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5-mini}
  connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
  read-timeout: ${OPENAI_READ_TIMEOUT:2m}

crawl:
  ai-review:
    enabled: ${CRAWL_AI_REVIEW_ENABLED:false}
