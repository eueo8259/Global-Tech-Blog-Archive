spring:
  application:
    name: global-tech-blog-archive
  profiles:
    default: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  config:
    import: "crawl/crawl-parser.yml"

server:
  port: ${SERVER_PORT:8080}

crawl:
  scheduler:
    enabled: ${CRAWL_SCHEDULER_ENABLED:false}
    cron: "${CRAWL_SCHEDULER_CRON:0 0 3 * * *}"
    zone: ${CRAWL_SCHEDULER_ZONE:Asia/Seoul}

slack:
  client-id: ${SLACK_CLIENT_ID:}
  client-secret: ${SLACK_CLIENT_SECRET:}
  redirect-uri: ${SLACK_REDIRECT_URI:}
  bot-scopes: ${SLACK_BOT_SCOPES:commands,chat:write}
  settings-base-url: ${SLACK_SETTINGS_BASE_URL:http://localhost:5173}
  bot-token-encryption:
    # Local test dummy key only. Do not use this value in production.
    # Example: SLACK_BOT_TOKEN_ENCRYPTION_KEY_BASE64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    key-base64: ${SLACK_BOT_TOKEN_ENCRYPTION_KEY_BASE64:}
