spring:
  application:
    name: global-tech-blog-archive
  profiles:
    default: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  config:
    import: "crawl/crawl-parser.yml"

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:${SERVER_PORT:8080}}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${METRICS_ENVIRONMENT:local}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://techport.dev,https://www.techport.dev,http://localhost:5173}

crawl:
  execution:
    source-concurrency: ${CRAWL_SOURCE_CONCURRENCY:2}
  scheduler:
    enabled: ${CRAWL_SCHEDULER_ENABLED:false}
    cron: "${CRAWL_SCHEDULER_CRON:0 0 3 * * *}"
    zone: ${CRAWL_SCHEDULER_ZONE:Asia/Seoul}
  ai-review:
    enabled: ${CRAWL_AI_REVIEW_ENABLED:true}
    cron: "${CRAWL_AI_REVIEW_CRON:0 */5 * * * *}"
    zone: ${CRAWL_AI_REVIEW_ZONE:Asia/Seoul}
    claim-limit: ${CRAWL_AI_REVIEW_CLAIM_LIMIT:50}
    batch-size: ${CRAWL_AI_REVIEW_BATCH_SIZE:10}
    max-attempts: ${CRAWL_AI_REVIEW_MAX_ATTEMPTS:3}
    max-failure-retry-limit: ${CRAWL_AI_REVIEW_MAX_FAILURE_RETRY_LIMIT:100}
    retry-delay: ${CRAWL_AI_REVIEW_RETRY_DELAY:5m}
    stale-timeout: ${CRAWL_AI_REVIEW_STALE_TIMEOUT:30m}

slack:
  client-id: ${SLACK_CLIENT_ID:}
  client-secret: ${SLACK_CLIENT_SECRET:}
  signing-secret: ${SLACK_SIGNING_SECRET:}
  redirect-uri: ${SLACK_REDIRECT_URI:}
  bot-scopes: ${SLACK_BOT_SCOPES:commands,chat:write,channels:history,groups:history,metadata.message:read}
  settings-base-url: ${SLACK_SETTINGS_BASE_URL:http://localhost:5173}
  bot-token-encryption:
    # Local test dummy key only. Do not use this value in production.
    # Example: SLACK_BOT_TOKEN_ENCRYPTION_KEY_BASE64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    key-base64: ${SLACK_BOT_TOKEN_ENCRYPTION_KEY_BASE64:}
  daily-digest:
    enabled: ${SLACK_DAILY_DIGEST_ENABLED:false}
    cron: "${SLACK_DAILY_DIGEST_CRON:0 0 9 * * *}"
    retry-cron: "${SLACK_DAILY_DIGEST_RETRY_CRON:0 */5 * * * *}"
    zone: ${SLACK_DAILY_DIGEST_ZONE:Asia/Seoul}
    cutoff-time: ${SLACK_DAILY_DIGEST_CUTOFF_TIME:09:00}
    max-attempts: ${SLACK_DAILY_DIGEST_MAX_ATTEMPTS:3}
    retry-delay: ${SLACK_DAILY_DIGEST_RETRY_DELAY:5m}
    stale-timeout: ${SLACK_DAILY_DIGEST_STALE_TIMEOUT:15m}
    verification-delay: ${SLACK_DAILY_DIGEST_VERIFICATION_DELAY:5m}
    verification-permission-error-delay: ${SLACK_DAILY_DIGEST_VERIFICATION_PERMISSION_ERROR_DELAY:1h}
    max-verification-checks: ${SLACK_DAILY_DIGEST_MAX_VERIFICATION_CHECKS:3}
    history-lookback: ${SLACK_DAILY_DIGEST_HISTORY_LOOKBACK:1m}
    history-page-size: ${SLACK_DAILY_DIGEST_HISTORY_PAGE_SIZE:15}
