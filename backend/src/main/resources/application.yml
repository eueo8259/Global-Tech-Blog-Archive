spring:
  application:
    name: global-tech-blog-archive
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/global_tech_blog_archive}
    username: ${DB_USERNAME:archive_user}
    password: ${DB_PASSWORD:archive_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
