spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-5-mini}
  connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
  read-timeout: ${OPENAI_READ_TIMEOUT:2m}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://techport-frontend-dev.vercel.app}

crawl:
  scheduler:
    enabled: false
  ai-review:
    enabled: ${CRAWL_AI_REVIEW_ENABLED:false}
  admin-api:
    key: ${CRAWL_ADMIN_API_KEY:}
