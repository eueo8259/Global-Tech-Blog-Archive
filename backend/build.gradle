plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.globaltechblogarchive'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform {
        excludeTags 'real'
    }
}

tasks.register('realTest', Test) {
    description = 'Runs tests against real external article sources.'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'real'
    }
    shouldRunAfter test
}

tasks.register('archiveBootstrapExport', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Exports articles and AI decisions to an NDJSON bootstrap archive.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.globaltechblogarchive.GlobalTechBlogArchiveApplication'
    args '--spring.main.web-application-type=none', '--bootstrap.command=export'
    doFirst {
        if (!project.hasProperty('file')) {
            throw new GradleException('Usage: archiveBootstrapExport -Pfile=<absolute-path>')
        }
        args "--bootstrap.file=${project.property('file')}"
    }
}

tasks.register('archiveBootstrapImport', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Imports an NDJSON bootstrap archive into an empty content database.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.globaltechblogarchive.GlobalTechBlogArchiveApplication'
    args '--spring.main.web-application-type=none', '--bootstrap.command=import'
    doFirst {
        if (!project.hasProperty('file')) {
            throw new GradleException('Usage: archiveBootstrapImport -Pfile=<absolute-path>')
        }
        args "--bootstrap.file=${project.property('file')}"
    }
}
