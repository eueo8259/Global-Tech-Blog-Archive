services:
  nginx:
    image: nginx:1.27-alpine
    container_name: techport-dev-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - techport-dev

  backend:
    image: ${BACKEND_IMAGE:-986995923369.dkr.ecr.ap-northeast-2.amazonaws.com/techport-backend:develop-latest}
    container_name: techport-dev-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-global_tech_blog_archive_dev}
      DB_USERNAME: ${DB_USERNAME:-archive_user}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://techport-frontend-dev.vercel.app}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_CONNECT_TIMEOUT: ${OPENAI_CONNECT_TIMEOUT:-3s}
      OPENAI_READ_TIMEOUT: ${OPENAI_READ_TIMEOUT:-2m}
      CRAWL_AI_REVIEW_ENABLED: ${CRAWL_AI_REVIEW_ENABLED:-true}
      CRAWL_AI_REVIEW_MAX_FAILURE_RETRY_LIMIT: ${CRAWL_AI_REVIEW_MAX_FAILURE_RETRY_LIMIT:-100}
      CRAWL_AI_REVIEW_STALE_TIMEOUT: ${CRAWL_AI_REVIEW_STALE_TIMEOUT:-30m}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI}
      SLACK_BOT_SCOPES: ${SLACK_BOT_SCOPES:-commands,chat:write}
      SLACK_SETTINGS_BASE_URL: ${SLACK_SETTINGS_BASE_URL}
      SLACK_BOT_TOKEN_ENCRYPTION_KEY_BASE64: ${SLACK_BOT_TOKEN_ENCRYPTION_KEY_BASE64}
      SLACK_DAILY_DIGEST_ENABLED: ${SLACK_DAILY_DIGEST_ENABLED:-false}
      SLACK_DAILY_DIGEST_CRON: "${SLACK_DAILY_DIGEST_CRON:-0 0 9 * * *}"
      SLACK_DAILY_DIGEST_RETRY_CRON: "${SLACK_DAILY_DIGEST_RETRY_CRON:-0 */5 * * * *}"
      SLACK_DAILY_DIGEST_ZONE: ${SLACK_DAILY_DIGEST_ZONE:-Asia/Seoul}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    networks:
      - techport-dev

  mysql:
    image: mysql:8.4
    container_name: techport-dev-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-global_tech_blog_archive_dev}
      MYSQL_USER: ${DB_USERNAME:-archive_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-dev-data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - techport-dev

networks:
  techport-dev:

volumes:
  mysql-dev-data:
