name: techport-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: techport-monitoring-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: techport-monitoring-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.1.0
    container_name: techport-monitoring-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_SERVER_DOMAIN: ${MONITORING_DOMAIN:?MONITORING_DOMAIN must be set}
      GF_SERVER_ROOT_URL: https://${MONITORING_DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
      - node-exporter
    networks:
      - monitoring

  nginx:
    image: nginx:1.29.8-alpine
    container_name: techport-monitoring-nginx
    restart: unless-stopped
    environment:
      MONITORING_DOMAIN: ${MONITORING_DOMAIN:?MONITORING_DOMAIN must be set}
      NGINX_ENVSUBST_FILTER: MONITORING_DOMAIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-config:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - grafana
    networks:
      - monitoring

  bootstrap-nginx:
    image: nginx:1.29.8-alpine
    container_name: techport-monitoring-bootstrap-nginx
    profiles:
      - bootstrap
    ports:
      - "80:80"
    volumes:
      - ./nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - monitoring

  certbot:
    image: certbot/certbot:v5.7.0
    profiles:
      - tools
    volumes:
      - certbot-config:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

networks:
  monitoring:

volumes:
  prometheus-data:
  grafana-data:
  certbot-config:
  certbot-webroot:
