name: Monitoring CD

on:
  push:
    branches: [develop]
    paths:
      - "infra/monitoring/**"
      - ".github/workflows/monitoring-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: monitoring-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy monitoring server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BACKEND_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy monitoring stack through SSM
        run: |
          cat > ssm-commands.json <<'JSON'
          {
            "commands": [
              "set -eu",
              "test -d /opt/techport-monitoring/.git",
              "sudo -u ubuntu git -C /opt/techport-monitoring checkout develop",
              "sudo -u ubuntu git -C /opt/techport-monitoring pull --ff-only origin develop",
              "cd /opt/techport-monitoring/infra/monitoring",
              "test -f .env",
              "docker compose --env-file .env -f docker-compose.monitoring.yml config --quiet",
              "docker compose --env-file .env -f docker-compose.monitoring.yml pull",
              "docker compose --env-file .env -f docker-compose.monitoring.yml up -d --remove-orphans",
              "docker compose --env-file .env -f docker-compose.monitoring.yml ps",
              "for attempt in $(seq 1 10); do if curl -fsS https://monitor.techport.dev/api/health; then break; fi; if [ \"$attempt\" -eq 10 ]; then exit 1; fi; sleep 3; done",
              "for attempt in $(seq 1 10); do if docker exec techport-monitoring-prometheus wget -qO- http://localhost:9090/-/ready; then break; fi; if [ \"$attempt\" -eq 10 ]; then exit 1; fi; sleep 3; done"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.MONITORING_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy monitoring stack ${GITHUB_SHA}" \
            --parameters file://ssm-commands.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command id: ${COMMAND_ID}"

          set +e
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ secrets.MONITORING_EC2_INSTANCE_ID }}"
          WAIT_STATUS=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ secrets.MONITORING_EC2_INSTANCE_ID }}" \
            --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
            --output json

          exit "${WAIT_STATUS}"
