name: Backend CI

on:
  pull_request:
    branches: [develop]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-dev-cd.yml"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-dev-cd.yml"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_number }}
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
