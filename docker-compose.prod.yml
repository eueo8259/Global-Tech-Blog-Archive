services:
  nginx:
    image: nginx:1.27-alpine
    container_name: techport-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - techport

  backend:
    image: ${BACKEND_IMAGE:-986995923369.dkr.ecr.ap-northeast-2.amazonaws.com/techport-backend:latest}
    container_name: techport-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 9090
      METRICS_ENVIRONMENT: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-global_tech_blog_archive}
      DB_USERNAME: ${DB_USERNAME:-archive_user}
      DB_PASSWORD: ${DB_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_CONNECT_TIMEOUT: ${OPENAI_CONNECT_TIMEOUT:-3s}
      OPENAI_READ_TIMEOUT: ${OPENAI_READ_TIMEOUT:-2m}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI}
      SLACK_BOT_SCOPES: ${SLACK_BOT_SCOPES:-commands,chat:write}
      SLACK_SETTINGS_BASE_URL: ${SLACK_SETTINGS_BASE_URL}
      SLACK_BOT_TOKEN_ENCRYPTION_KEY_BASE64: ${SLACK_BOT_TOKEN_ENCRYPTION_KEY_BASE64}
      SLACK_DAILY_DIGEST_ENABLED: ${SLACK_DAILY_DIGEST_ENABLED:-false}
      SLACK_DAILY_DIGEST_CRON: "${SLACK_DAILY_DIGEST_CRON:-0 0 9 * * *}"
      SLACK_DAILY_DIGEST_RETRY_CRON: "${SLACK_DAILY_DIGEST_RETRY_CRON:-0 */5 * * * *}"
      SLACK_DAILY_DIGEST_ZONE: ${SLACK_DAILY_DIGEST_ZONE:-Asia/Seoul}
      CRAWL_SCHEDULER_ENABLED: ${CRAWL_SCHEDULER_ENABLED:-false}
      CRAWL_SCHEDULER_CRON: "${CRAWL_SCHEDULER_CRON:-0 0 3 * * *}"
      CRAWL_SCHEDULER_ZONE: ${CRAWL_SCHEDULER_ZONE:-Asia/Seoul}
      CRAWL_AI_REVIEW_ENABLED: ${CRAWL_AI_REVIEW_ENABLED:-true}
      CRAWL_AI_REVIEW_CRON: "${CRAWL_AI_REVIEW_CRON:-0 */5 * * * *}"
      CRAWL_AI_REVIEW_ZONE: ${CRAWL_AI_REVIEW_ZONE:-Asia/Seoul}
      CRAWL_AI_REVIEW_CLAIM_LIMIT: ${CRAWL_AI_REVIEW_CLAIM_LIMIT:-50}
      CRAWL_AI_REVIEW_BATCH_SIZE: ${CRAWL_AI_REVIEW_BATCH_SIZE:-10}
      CRAWL_AI_REVIEW_MAX_ATTEMPTS: ${CRAWL_AI_REVIEW_MAX_ATTEMPTS:-3}
      CRAWL_AI_REVIEW_MAX_FAILURE_RETRY_LIMIT: ${CRAWL_AI_REVIEW_MAX_FAILURE_RETRY_LIMIT:-100}
      CRAWL_AI_REVIEW_RETRY_DELAY: ${CRAWL_AI_REVIEW_RETRY_DELAY:-5m}
      CRAWL_AI_REVIEW_STALE_TIMEOUT: ${CRAWL_AI_REVIEW_STALE_TIMEOUT:-30m}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "9090:9090"
    expose:
      - "8080"
      - "9090"
    networks:
      - techport

  mysql:
    image: mysql:8.4
    container_name: techport-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-global_tech_blog_archive}
      MYSQL_USER: ${DB_USERNAME:-archive_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - techport

networks:
  techport:

volumes:
  mysql-data:
