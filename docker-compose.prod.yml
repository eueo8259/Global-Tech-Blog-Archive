services:
  nginx:
    image: nginx:1.27-alpine
    container_name: techport-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - techport

  backend:
    image: ${BACKEND_IMAGE:-986995923369.dkr.ecr.ap-northeast-2.amazonaws.com/techport-backend:latest}
    container_name: techport-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-global_tech_blog_archive}
      DB_USERNAME: ${DB_USERNAME:-archive_user}
      DB_PASSWORD: ${DB_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - techport

  mysql:
    image: mysql:8.4
    container_name: techport-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-global_tech_blog_archive}
      MYSQL_USER: ${DB_USERNAME:-archive_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - techport

networks:
  techport:

volumes:
  mysql-data:
